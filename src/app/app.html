<!-- Global Session Expiry Warning Modal Popup (Triggers when token has <= 20s remaining) -->
@if (authService.showExpiryWarning()) {
  <div class="session-modal-backdrop">
    <div class="session-modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-icon-wrapper">
        <span class="modal-icon">⏳</span>
      </div>
      <h3 id="modal-title" class="modal-title">Your Session is Expiring!</h3>
      <p class="modal-message">
        You will be automatically logged out in 
        <span class="countdown-badge">{{ authService.tokenRemainingSeconds() }}s</span>.
      </p>
      <p class="modal-submessage">
        Click below to extend your session and keep your work going without any interruption.
      </p>
      
      <div class="modal-actions">
        <button 
          type="button" 
          class="btn-extend" 
          (click)="extendSession()" 
          [disabled]="isRefreshing()">
          @if (isRefreshing()) {
            <span>🔄 Extending Session...</span>
          } @else {
            <span>✅ OK, Keep Me Logged In</span>
          }
        </button>
        <button 
          type="button" 
          class="btn-logout" 
          (click)="dismissAndLogout()" 
          [disabled]="isRefreshing()">
          Logout Now
        </button>
      </div>
    </div>
  </div>
}

<div class="app-layout">
  <router-outlet></router-outlet>
</div>
